name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.compiler }} build and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Clang
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify installed public headers
        if: matrix.compiler == 'gcc'
        run: |
          cmake --install build --prefix "$PWD/stage"

          cat > /tmp/canonical.cpp <<'EOF'
          #include <coda/format/format.h>
          int main() { coda::format value("{0}", "canonical"); return value.specifiers(); }
          EOF

          cat > /tmp/legacy.cpp <<'EOF'
          #include <format.h>
          int main() { coda::format value("{0}", "legacy"); return value.specifiers(); }
          EOF

          g++ -std=c++17 -I"$PWD/stage/include" -c /tmp/canonical.cpp -o /tmp/canonical.o
          g++ -std=c++17 -I"$PWD/stage/include/coda/format" -c /tmp/legacy.cpp -o /tmp/legacy.o

  sanitizers:
    name: ASAN and UBSAN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang

      - name: Configure
        run: |
          cmake -S . -B build-sanitizers \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build-sanitizers --parallel 2

      - name: Test with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitizers --output-on-failure

  fuzz-harness-smoke:
    name: Fuzz harness smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure fuzz target
        run: |
          cmake -S . -B build-fuzz-smoke \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCODA_BUILD_TESTS=OFF \
            -DCODA_BUILD_FUZZERS=ON

      - name: Build fuzz target
        run: cmake --build build-fuzz-smoke --parallel 2 --target coda_format_afl

      - name: Replay seed corpus
        run: |
          for input in fuzz/corpora/format/*; do
            build-fuzz-smoke/fuzz/coda_format_afl < "$input"
          done

  afl-smoke:
    name: AFL++ bounded smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install AFL++
        run: |
          sudo apt-get update
          sudo apt-get install --yes afl++

      - name: Configure AFL++ target
        run: cmake --preset afl

      - name: Build AFL++ target
        run: cmake --build --preset afl --parallel 2 --target coda_format_afl

      - name: Verify AFL++ instrumentation
        run: afl-showmap -q -o /dev/null -- build/afl/fuzz/coda_format_afl < fuzz/corpora/format/canonical.txt

      - name: Run bounded AFL++ campaign
        env:
          AFL_NO_UI: "1"
          AFL_SKIP_CPUFREQ: "1"
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
        run: |
          afl-fuzz -V 5 \
            -i fuzz/corpora/format \
            -o build/afl/smoke-findings \
            -x fuzz/dictionaries/format.dict \
            -- build/afl/fuzz/coda_format_afl
